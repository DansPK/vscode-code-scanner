services:
  harness:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      HARNESS_DATA_DIR: /data
      HARNESS_TOKENS_FILE: /data/tokens.json
      SONAR_HOST_URL: http://sonarqube:9000
      # The agents' web search; set WEB_SEARCH_URL= (empty) in .env to turn it off.
      WEB_SEARCH_URL: ${WEB_SEARCH_URL-http://searxng:8080}
    volumes:
      - harness-data:/data
      # TLS certificate and key, if HARNESS_TLS_CERT/HARNESS_TLS_KEY point here (scripts/make_dev_cert.sh)
      - ./certs:/certs:ro
    # Lets LLM_BASE_URL use host.docker.internal on Linux too (Docker Desktop has it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - sonarqube
      - searxng
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run setup.sh or set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
    depends_on:
      - sonar-db
    restart: unless-stopped

  sonar-db:
    image: postgres:16
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  harness-data:
  sonarqube-data:
  sonarqube-extensions:
  sonar-db:
