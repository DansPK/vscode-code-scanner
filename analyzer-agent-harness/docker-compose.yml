services:
  harness:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      HARNESS_DATA_DIR: /data
      HARNESS_TOKENS_FILE: /data/tokens.json
      SONAR_HOST_URL: http://sonarqube:9000
    volumes:
      - harness-data:/data
      # TLS certificate and key, if HARNESS_TLS_CERT/HARNESS_TLS_KEY point here (scripts/make_dev_cert.sh)
      - ./certs:/certs:ro
    depends_on:
      - sonarqube
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
    depends_on:
      - sonar-db
    restart: unless-stopped

  sonar-db:
    image: postgres:16
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  harness-data:
  sonarqube-data:
  sonarqube-extensions:
  sonar-db:
